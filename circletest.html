<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>触控板圆形测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 16px;
  background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:1.6;pointer-events:none}
#hud b{color:#fc0}
#result{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#0f0;padding:14px 28px;border-radius:10px;
  font-size:22px;font-family:monospace;white-space:nowrap;pointer-events:none}
#btn{position:fixed;top:10px;right:16px;z-index:10;padding:6px 14px;
  background:#444;color:#eee;border:1px solid #888;cursor:pointer;border-radius:6px}
#btn:hover{background:#666}
#log{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  color:#666;font:12px monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  操作方法：<b>按住鼠标左键</b>，在触控板上<b>慢慢画一个大圆</b>（一圈即可），<b>松开</b>。<br>
  下方会显示轨迹的 <b>竖向长度 ÷ 横向长度</b> 比值。≈1.00 就是正圆。
</div>
<div id="btn" onclick="clear()">清空重来</div>
<div id="log"></div>
<div id="result"></div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const log=document.getElementById('log');
const res=document.getElementById('result');
let on=false,sx,sy,mnx,mxx,mny,mxy,pts=[],raf=null;

function fit(){cv.width=innerWidth;cv.height=innerHeight}
fit();onresize=fit;

function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,cv.width,cv.height);
  if(pts.length<2)return;
  ctx.strokeStyle='#0fa';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  ctx.strokeStyle='#f806';ctx.lineWidth=1;
  ctx.strokeRect(mnx,mny,mxx-mnx,mxy-mny);
}

function calc(){
  if(pts.length<10){res.textContent='数据太少，再来一次';res.style.color='#f44';return}
  const w=mxx-mnx,h=mxy-mny;
  if(!w||!h){res.textContent='没有有效移动';return}
  const r=h/w;
  let t=r.toFixed(2)+'  (高÷宽)';
  if(r>0.97&&r<1.03)t+='  → 正圆！';
  else if(r>=1.03)t+='  → 竖向偏快 ('+(r*100-100).toFixed(0)+'% 多)';
  else t+='  → 竖向偏慢 ('+(100-r*100).toFixed(0)+'% 少)';
  res.textContent=t;res.style.color=r>0.97&&r<1.03?'#0f0':'#fc0';
}

// --- mouse ---
function md(e){
  if(e.button!==0)return;
  on=true;pts=[];sx=e.clientX;sy=e.clientY;
  mnx=mxx=sx;mny=mxy=sy;pts.push({x:sx,y:sy});
  res.textContent='画圆中…';res.style.color='#0f0';
  e.preventDefault();
}
function mm(e){
  if(!on)return;
  const x=e.clientX,y=e.clientY;
  pts.push({x,y});
  if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(draw);
}
function mu(){if(!on)return;on=false;calc();document.getElementById('btn').textContent='清空重来'}

// --- touch (fallback) ---
function td(e){
  if(e.touches.length!==1)return;
  const t=e.touches[0];on=true;pts=[];sx=t.clientX;sy=t.clientY;
  mnx=mxx=sx;mny=mxy=sy;pts.push({x:sx,y:sy});
  res.textContent='画圆中…';res.style.color='#0f0';e.preventDefault();
}
function tm(e){
  if(!on||!e.touches.length)return;
  const t=e.touches[0],x=t.clientX,y=t.clientY;
  pts.push({x,y});
  if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(draw);
}
function tu(){if(!on)return;on=false;calc();document.getElementById('btn').textContent='清空重来'}

cv.onmousedown=md;cv.onmousemove=mm;cv.onmouseup=mu;cv.onmouseleave=mu;
cv.ontouchstart=td;cv.ontouchmove=tm;cv.ontouchend=tu;
cv.ontouchcancel=tu;

function clear(){
  pts=[];on=false;
  ctx.fillStyle='#111';ctx.fillRect(0,0,cv.width,cv.height);
  document.getElementById('btn').textContent='清空重来';
  res.textContent='按住画圆';res.style.color='#fff';
}

log.textContent='ready — 事件: mouse'+('onmousedown' in cv)+' | touch'+('ontouchstart' in cv);
clear();
</script>
</body>
</html>
